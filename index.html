<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Vui Cùng Tin Học VR - Mô Phỏng Thực Tế Ảo Tiểu Học</title>
  
  <!-- Nạp A-Frame 1.5.0 chuẩn W3C WebXR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    /* RESET & KHUNG GIAO DIỆN HỌC TẬP CHUẨN SƯ PHẠM (HUD UI) */
    * { box-sizing: border-box; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Thanh chọn góc nhìn & bài học phía trên */
    #top-nav {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 16px;
      border-radius: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-btn {
      background: #0288D1;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn:hover { background: #03A9F4; transform: translateY(-2px); }
    .nav-btn.active { background: #2E7D32; box-shadow: 0 0 10px #4CAF50; }
    .nav-btn.alt { background: #E65100; }

    /* Thẻ hướng dẫn học tập tiếng Việt sắc nét phía dưới */
    #instruction-card {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      width: 92%;
      max-width: 800px;
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid #00E5FF;
      border-radius: 16px;
      padding: 14px 22px;
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      backdrop-filter: blur(5px);
    }
    #lesson-title {
      font-size: 13px;
      font-weight: 700;
      color: #00E5FF;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #guide-text {
      font-size: 15px;
      line-height: 1.5;
      font-weight: 500;
      color: #FFF9C4;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #score-bar {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    #score-badge {
      background: #2E7D32;
      color: #FFFFFF;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
    }
    #reset-btn {
      background: #D32F2F;
      color: #FFF;
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #reset-btn:hover { background: #F44336; }
  </style>
